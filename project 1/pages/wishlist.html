
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | Sabari Craft</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FAF7F0] pt-[72px] text-[#33251D]">

  <div id="navbar-placeholder"></div>

  <main class="mx-auto max-w-7xl px-4 py-10">
    <section class="mb-8 rounded-3xl border border-[#E8DCC8] bg-[#F0E5D3] p-6 sm:p-10">
      <p class="text-xs font-bold uppercase tracking-[.2em] text-[#A46F2D]">Your saved collection</p>
      <h2 class="mt-2 text-3xl font-black sm:text-4xl">My Wishlist</h2>
      <p class="mt-3 text-[#75675B]">Save your favorite malas and add them to your cart whenever you are ready.</p>
    </section>

    <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <p id="summary" class="text-sm text-[#75675B]">Your saved products</p>
      <a href="shop.html" class="rounded-xl border border-[#D7C5AD] bg-white px-4 py-3 text-sm font-bold">
        ← Continue Shopping
      </a>
    </div>

    <section id="wishlist" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></section>

    <section id="empty" class="hidden rounded-3xl border border-dashed border-[#D7C5AD] bg-white px-6 py-14 text-center">
      <p class="text-5xl text-[#78452B]">♡</p>
      <h3 class="mt-4 text-2xl font-bold">Your wishlist is empty</h3>
      <p class="mt-2 text-[#75675B]">Browse our collection and save your favorite malas.</p>
      <a href="shop.html" class="mt-6 inline-block rounded-xl bg-[#78452B] px-6 py-3 font-bold text-white">
        Explore Malas
      </a>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    const WISHLIST_KEY = "sabariCraftWishlist";
    const CART_KEY = "sabariCraftCart";

    function readStorage(key) {
      try {
        const data = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function money(amount) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(Number(amount) || 0);
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getId(product) {
      return String(product.id ?? product.productId ?? product.name ?? "");
    }

    function getBeads(product) {
      return Number.parseInt(product.beadCount ?? product.beads ?? product.bead_count ?? 108, 10) === 54 ? 54 : 108;
    }

    function getPrice(product) {
      return Number(product.unitPrice ?? product.price ?? product.unit_price ?? 0) || 0;
    }

    function getImage(product) {
      return product.image || product.imagePath || product.image_path || "";
    }

    function updateBadges() {
      const wishlist = readStorage(WISHLIST_KEY);
      const cart = readStorage(CART_KEY);

      const cartCount = cart.reduce(
        (total, item) => total + Math.max(1, Number(item.quantity) || 1),
        0
      );
      const wishlistBadge = document.getElementById("wish-count");
      const cartBadge = document.getElementById("cart-count");
      if (!wishlistBadge || !cartBadge) return;

      wishlistBadge.textContent = wishlist.length;
      cartBadge.textContent = cartCount;
      wishlistBadge.closest("a").setAttribute(
        "aria-label",
        `Wishlist, ${wishlist.length} ${wishlist.length === 1 ? "item" : "items"}`
      );
      cartBadge.closest("a").setAttribute(
        "aria-label",
        `Shopping cart, ${cartCount} ${cartCount === 1 ? "item" : "items"}`
      );
    }

    function renderWishlist() {
      const products = readStorage(WISHLIST_KEY);
      const container = document.getElementById("wishlist");
      const empty = document.getElementById("empty");

      container.innerHTML = "";
      document.getElementById("summary").textContent =
        `${products.length} saved ${products.length === 1 ? "item" : "items"}`;

      empty.classList.toggle("hidden", products.length > 0);
      container.classList.toggle("hidden", products.length === 0);

      products.forEach((product, index) => {
        const name = product.name || product.title || "Devotional Mala";
        const beads = getBeads(product);
        const price = getPrice(product);
        const image = getImage(product);

        const card = document.createElement("article");
        card.className = "overflow-hidden rounded-2xl border border-[#E8DCC8] bg-white shadow-sm";

        card.innerHTML = `
          <div class="relative aspect-[4/3] bg-[#F0E5D3]">
            ${image ? `
              <img src="${escapeHTML(image)}" alt="${escapeHTML(name)}"
                   class="h-full w-full object-cover"
                   onerror="this.style.display='none'">
            ` : `
              <div class="flex h-full items-center justify-center text-sm text-[#75675B]">
                Product Image
              </div>
            `}
            <button data-remove="${index}" aria-label="Remove from wishlist"
              class="absolute right-3 top-3 flex h-9 w-9 items-center justify-center rounded-full bg-white text-[#78452B] shadow-md transition hover:bg-[#F0E5D3] focus:outline-none focus:ring-2 focus:ring-[#A46F2D]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>
              </svg>
            </button>
          </div>

          <div class="p-4">
            <p class="text-xs font-bold uppercase tracking-widest text-[#A46F2D]">${beads} Beads</p>
            <h3 class="mt-1 text-lg font-bold">${escapeHTML(name)}</h3>
            <p class="mt-3 text-xl font-black text-[#78452B]">${money(price)}</p>

            <div class="mt-4 grid grid-cols-2 gap-2">
              <button data-cart="${index}"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#78452B] px-3 py-3 text-sm font-bold text-white hover:bg-[#5F3521]">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="9" cy="21" r="1"/>
                  <circle cx="20" cy="21" r="1"/>
                  <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
                </svg>
                Add to Cart
              </button>
              <button data-remove="${index}"
                aria-label="Remove ${escapeHTML(name)} from wishlist"
                class="inline-flex items-center justify-center gap-2 rounded-xl border border-[#D7C5AD] px-3 py-3 text-sm font-bold hover:bg-[#FAF7F0]">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 6h18"/>
                  <path d="M8 6V4h8v2"/>
                  <path d="m19 6-1 14H6L5 6"/>
                  <path d="M10 11v5M14 11v5"/>
                </svg>
                Remove
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      updateBadges();
    }

    document.getElementById("wishlist").addEventListener("click", event => {
      const removeButton = event.target.closest("[data-remove]");
      const cartButton = event.target.closest("[data-cart]");

      if (removeButton) {
        const wishlist = readStorage(WISHLIST_KEY);
        wishlist.splice(Number(removeButton.dataset.remove), 1);
        saveStorage(WISHLIST_KEY, wishlist);
        renderWishlist();
        return;
      }

      if (cartButton) {
        const wishlist = readStorage(WISHLIST_KEY);
        const product = wishlist[Number(cartButton.dataset.cart)];

        if (!product) return;

        const cart = readStorage(CART_KEY);
        const id = getId(product);
        const beads = getBeads(product);

        const existing = cart.find(item =>
          getId(item) === id &&
          getBeads(item) === beads &&
          getPrice(item) === getPrice(product)
        );

        if (existing) {
          existing.quantity = Math.max(1, Number(existing.quantity) || 1) + 1;
        } else {
          cart.push({
            ...product,
            id,
            beadCount: beads,
            unitPrice: getPrice(product),
            quantity: 1
          });
        }

        saveStorage(CART_KEY, cart);
        updateBadges();

        cartButton.textContent = "Added ✓";
        setTimeout(() => {
          if (cartButton.isConnected) cartButton.textContent = "Add to Cart";
        }, 1000);
      }
    });

    window.addEventListener("storage", renderWishlist);
    renderWishlist();
    window.addEventListener("sabari-components-loaded", renderWishlist);
  </script>
  <script src="component-loader.js"></script>
</body>
</html>
